<section class="panel filters-panel" id="filters" aria-labelledby="filters-title">
  <div class="section-heading">
    <div>
      <p class="eyebrow">Consulta</p>
      <h2 id="filters-title">Filtrar actividad</h2>
    </div>
    <a class="text-link" href="{% url 'api-dashboard' %}">Ver datos JSON <span aria-hidden="true">↗</span></a>
  </div>
  <form method="get" action="{% url 'dashboard' %}" class="filter-form">
    <label for="id_asset_id">
      {{ filter_form.asset_id.label }}
      {{ filter_form.asset_id }}
    </label>
    <label for="id_affected_status">
      {{ filter_form.affected_status.label }}
      {{ filter_form.affected_status }}
    </label>
    <button class="button button--primary" type="submit">Aplicar filtros</button>
    <a class="button button--quiet" href="{% url 'dashboard' %}" data-live-reset>Limpiar</a>
  </form>
</section>
