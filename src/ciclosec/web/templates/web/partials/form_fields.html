{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="form-field{% if field.field.widget.input_type == 'checkbox' %} form-field--check{% endif %}">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
