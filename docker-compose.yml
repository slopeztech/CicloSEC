services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CICLOSEC_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${CICLOSEC_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["app"]
    image: ciclosec:local
    build:
      context: .
    environment:
      CICLOSEC_CONFIG_PATH: /app/config/ciclosec.yaml
      CICLOSEC_DJANGO_SECRET_KEY: ${CICLOSEC_DJANGO_SECRET_KEY:?Set CICLOSEC_DJANGO_SECRET_KEY in .env}
      CICLOSEC_DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      CICLOSEC_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config/ciclosec.yaml:/app/config/ciclosec.yaml:ro
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["app"]
    image: ciclosec:local
    build:
      context: .
    environment:
      CICLOSEC_CONFIG_PATH: /app/config/ciclosec.yaml
      CICLOSEC_DJANGO_SECRET_KEY: ${CICLOSEC_DJANGO_SECRET_KEY:?Set CICLOSEC_DJANGO_SECRET_KEY in .env}
      CICLOSEC_DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      CICLOSEC_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config/ciclosec.yaml:/app/config/ciclosec.yaml:ro
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:${CICLOSEC_WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    image: ciclosec:local
    build:
      context: .
    env_file:
      - .env
    environment:
      CICLOSEC_CONFIG_PATH: /app/config/ciclosec.yaml
      CICLOSEC_DJANGO_SECRET_KEY: ${CICLOSEC_DJANGO_SECRET_KEY:?Set CICLOSEC_DJANGO_SECRET_KEY in .env}
      CICLOSEC_DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      CICLOSEC_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config/ciclosec.yaml:/app/config/ciclosec.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      ["celery", "-A", "ciclosec.project.celery:app", "worker", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    profiles: ["scheduler"]
    image: ciclosec:local
    build:
      context: .
    environment:
      CICLOSEC_CONFIG_PATH: /app/config/ciclosec.yaml
      CICLOSEC_DJANGO_SECRET_KEY: ${CICLOSEC_DJANGO_SECRET_KEY:?Set CICLOSEC_DJANGO_SECRET_KEY in .env}
      CICLOSEC_DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      CICLOSEC_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config/ciclosec.yaml:/app/config/ciclosec.yaml:ro
    command:
      ["celery", "-A", "ciclosec.project.celery:app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
