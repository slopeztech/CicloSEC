[project]
name = "ciclosec"
version = "0.1.0"
description = "Local-first security monitoring and vulnerability management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.7.0",
    "cyclonedx-python-lib[json-validation]>=11.12.0",
    "dj-database-url>=3.1.2",
    "django>=5.2,<6.0",
    "djangorestframework>=3.18.3",
    "mcp>=2.3.0,<3.0.0",
    "packageurl-python>=0.17.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "spdx-tools>=0.8.5",
]

[project.scripts]
ciclosec-mcp = "ciclosec.mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6.0",
    "djangorestframework-stubs>=3.16.9",
    "mkdocs>=1.6.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "ciclosec.project.settings"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/ciclosec"]
strict = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "ciclosec.project.settings"

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
